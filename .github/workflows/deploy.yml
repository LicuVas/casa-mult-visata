name: Build and Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-netlify
  # false = build-urile se pun la coadă și se termină pe rând (nu se anulează unul pe altul).
  # Clientul salvează des din CMS → cu `true`, salvările rapide anulau build-urile în lanț
  # și anunțurile/pozele noi nu mai ajungeau live. Coada garantează că ultima stare se publică.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit so IndexNow can diff changed listings

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist || (echo "::error::dist/ missing"; exit 1)
          test -d dist/images || (echo "::error::dist/images missing - would wipe Netlify CDN"; exit 1)
          test -d dist/admin || (echo "::error::dist/admin missing"; exit 1)
          echo "dist OK ($(ls dist | wc -l) entries, $(ls dist/images | wc -l) images)"

      - name: Upload dist (pentru publicarea din ramura protejata)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish (ramura protejata "publicare", mediul "productie")
        # Cheia Netlify NU mai sta in depozit (07.11.2026). Publicarea o face publica.yml de pe ramura
        # "publicare", singura care ajunge la mediul "productie"; aici doar o pornim si asteptam rezultatul.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh workflow run publica.yml --ref publicare -f run_id="$GITHUB_RUN_ID" -f sha="$GITHUB_SHA" -f ciorna=false
          ID=""
          for i in $(seq 1 36); do
            sleep 5
            ID=$(gh run list --workflow publica.yml --branch publicare --event workflow_dispatch --limit 30 \
                 --json databaseId,displayTitle \
                 --jq ".[] | select(.displayTitle | endswith(\"din rularea $GITHUB_RUN_ID\")) | .databaseId" | head -1)
            [ -n "$ID" ] && break
          done
          [ -n "$ID" ] || { echo "::error::nu gasesc rularea publica.yml pornita acum"; exit 1; }
          echo "publicarea: https://github.com/$GH_REPO/actions/runs/$ID"
          gh run watch "$ID" --exit-status --interval 15 > /dev/null || { echo "::error::publicarea a picat: https://github.com/$GH_REPO/actions/runs/$ID"; exit 1; }
          echo "publicat pe Netlify"

      - name: Notify IndexNow (Bing/Yandex -> minutes, also feeds ChatGPT Search)
        run: node scripts/indexnow.mjs
        continue-on-error: true   # a Bing hiccup must never fail the client's publish
